name: Channel owners
on:
  workflow_dispatch:
    inputs:
      args:
        description: "usernames (empty = enabled job channels)"
        required: false
        default: ""
jobs:
  owners:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r scraper/requirements.txt
      - run: python tools/owners.py ${{ inputs.args }}
