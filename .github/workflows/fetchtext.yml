name: Fetch contact text
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "public page URLs, space separated (text only, no media)"
        required: true
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r scraper/requirements.txt
      - run: python tools/fetchtext.py ${{ inputs.urls }}
