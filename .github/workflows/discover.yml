name: Discover channels
on:
  workflow_dispatch:
    inputs:
      args:
        description: "extra seed usernames and/or --no-search"
        required: false
        default: ""
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r scraper/requirements.txt
      - run: python tools/discover.py ${{ inputs.args }}
