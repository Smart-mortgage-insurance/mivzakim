name: One-time media import
on: workflow_dispatch
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy images from the previous repo
        run: |
          git clone --depth 1 https://github.com/Smart-mortgage-insurance/prigram.git /tmp/src
          rm -rf data/media && cp -r /tmp/src/data/media data/media
          cp /tmp/src/ads/*.gif ads/ 2>/dev/null || true
          git config user.name "מערכת מבזקים"
          git config user.email "editor@mivzakim.news"
          git add -A data/media ads
          git commit -m "ייבוא תמונות [skip ci]" || echo "nothing to commit"
          git push
