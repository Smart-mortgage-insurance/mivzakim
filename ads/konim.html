  *{margin:0;padding:0;box-sizing:border-box}

  #phone .addr{flex:1;height:34px;border-radius:17px;background:#eaf3ee;border:1px solid #d9e8e0}
  #phone .menu{color:#a3b8ac;font-size:26px;letter-spacing:3px}

  .thumb svg{display:block;width:100%;height:100%}
  .thumb{overflow:hidden;width:158px;height:158px;border-radius:32px;object-fit:cover;flex:none;box-shadow:0 12px 24px rgba(20,60,44,.16);background:#eef2f0}
  .info{flex:1;min-width:0}
  .pn{font-weight:800;font-size:38px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stars{display:flex;gap:5px;margin-top:12px}
  .stars svg{width:39px;height:39px;display:block}
  .pricewrap{display:flex;align-items:center;gap:13px;margin-top:12px}
  .price{font-weight:800;font-size:35px;color:#b9c7c0}
  .price.real{color:var(--green)}
  .old{font-weight:700;font-size:26px;color:#aeb7b2;text-decoration:line-through;opacity:0}
  .verdict{display:inline-flex;align-items:center;gap:10px;margin-top:13px;font-weight:800;font-size:28px;padding:13px 22px;border-radius:42px;opacity:0;transform:scale(.5);white-space:nowrap}

  .verdict.bad{background:#fdecea;color:var(--red)} .verdict.bad .ic{background:var(--red)}
  .verdict.good{background:#e6f6ef;color:var(--brand-btn)} .verdict.good .ic{background:var(--green)}

  #mag{left:0;top:0;width:224px;height:224px;opacity:0}
  #mag svg{width:224px;height:224px;display:block;filter:drop-shadow(0 16px 28px rgba(10,60,44,.34))}
  #scan{position:absolute;left:0;top:0;width:520px;height:6px;background:linear-gradient(90deg,transparent,rgba(15,157,110,.85),transparent);opacity:0;border-radius:6px}

  #subline{position:absolute;top:1576px;left:70px;width:940px;text-align:center;font-size:30px;font-weight:500;color:#3f5a4f;line-height:1.45;opacity:0}

    box-shadow:0 22px 46px rgba(10,92,64,.36);opacity:0;white-space:nowrap}
  #cta .dot{width:15px;height:15px;border-radius:50%;background:#bff3da}

  #veil{position:absolute;inset:0;background:#eef6f1;opacity:0;pointer-events:none}

function seek(t){
  const ph=document.getElementById('phone');
  const intro=seg(t,0,0.7); ph.style.opacity=intro; ph.style.transform=`translateY(${lerp(30,0,easeOut(intro))}px)`;
  const bm=document.getElementById('brand'); bm.style.opacity=seg(t,0.1,0.7); bm.style.transform=`translateY(${lerp(-12,0,easeOut(seg(t,0.1,0.7)))}px)`;
  // persistent FREE bar — fades in once, then stays visible the whole loop
  document.getElementById('freebar').style.opacity=seg(t,0.25,0.75);

  rows.forEach((r,i)=>{const a=seg(t,0.35+i*0.10,0.35+i*0.10+0.45); r.style.opacity=a; r.style.transform=`translateX(${lerp(24,0,easeOut(a))}px)`;});

  const h1=seg(t,0.9,1.3)*(1-seg(t,2.4,2.75));
  const h2=seg(t,2.65,3.05)*(1-seg(t,lastReveal-0.05,lastReveal+0.3));
  const h3=seg(t,lastReveal+0.15,lastReveal+0.55);
  document.getElementById('h1').style.opacity=h1; document.getElementById('h1').style.transform=`translateY(${lerp(16,0,easeOut(seg(t,0.9,1.3)))}px)`;
  document.getElementById('h2').style.opacity=h2; document.getElementById('h2').style.transform=`translateY(${lerp(16,0,easeOut(seg(t,2.65,3.05)))}px)`;
  document.getElementById('h3').style.opacity=h3; document.getElementById('h3').style.transform=`translateY(${lerp(16,0,easeOut(seg(t,lastReveal+0.15,lastReveal+0.55)))}px)`;
  document.getElementById('kicker').style.opacity=seg(t,0.9,1.4)*(1-seg(t,2.4,2.75));

  rows.forEach((r,i)=>{
    const rev=seg(t,rowReveal(i)-0.05,rowReveal(i)+0.3);
    const fs=PRODUCTS[i].finalStars;
    r.querySelector('.stars').innerHTML=Array.from({length:5},(_,k)=>(rev>0.5&&k>=fs)?grey:gold).join('');
    const pr=r.querySelector('.price'); const old=r.querySelector('.old');
    if(rev>0.5){pr.textContent=PRODUCTS[i].price;pr.classList.add('real');pr.style.transform=`scale(${pop(seg(t,rowReveal(i),rowReveal(i)+0.3))})`;
      if(PRODUCTS[i].old){old.textContent=PRODUCTS[i].old;old.style.opacity=seg(t,rowReveal(i)+0.05,rowReveal(i)+0.35);}else{old.textContent='';}}
    else{pr.textContent='?';pr.classList.remove('real');pr.style.transform='none';old.textContent='';old.style.opacity=0;}
    const v=r.querySelector('.verdict'); const vv=seg(t,rowReveal(i)+0.02,rowReveal(i)+0.34);
    v.style.opacity=vv; v.style.transform=`scale(${pop(vv)})`;
  });

  const mag=document.getElementById('mag'), scan=document.getElementById('scan');
  const mIn=seg(t,scanIn-0.2,scanIn+0.1), mOut=seg(t,lastReveal+0.05,lastReveal+0.4); const vis=mIn*(1-mOut);
  mag.style.opacity=vis;
  let pos=0; const frac=(t-scanIn)/rowGap;
  if(frac>0){ const i=Math.min(Math.floor(frac),N-1); const local=frac-i; pos=clamp((i-1)+easeOut(clamp(local/0.16,0,1)),0,N-1); }
  const yy=ROWTOP+pos*ROWH+ROWVIS/2;
  const thumbCX=580-30-79;
  mag.style.transform=`translate(${thumbCX-112}px, ${yy-112}px)`;
  scan.style.opacity=vis*0.75;
  scan.style.transform=`translate(30px, ${yy}px)`;

  document.getElementById('subline').style.opacity=seg(t,lastReveal+0.4,lastReveal+0.9);
  document.getElementById('subline').style.transform=`translateY(${lerp(12,0,easeOut(seg(t,lastReveal+0.4,lastReveal+0.9)))}px)`;
  const c=document.getElementById('cta'), cv=seg(t,lastReveal+0.85,lastReveal+1.25);
  c.style.opacity=cv; c.style.transform=`translateX(-50%) translateY(${lerp(14,0,easeOut(cv))}px) scale(${pop(cv)})`;

  const vIn=seg(t,DUR-0.4,DUR), vOut=1-seg(t,0,0.25);
  document.getElementById('veil').style.opacity=Math.max(vIn,vOut);
}
let start=null,playing=true;
function frame(ts){if(!playing)return;if(start===null)start=ts;seek(((ts-start)/1000)%DUR);requestAnimationFrame(frame);}
requestAnimationFrame(frame);
window.__seek=t=>{playing=false;seek(t);};
window.__ready=true; window.__DUR=DUR;
</script>
</body>
</html>
